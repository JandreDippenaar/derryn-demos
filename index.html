<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your New Website | Derryn Holliday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F7F5F0;--card:#FFFFFF;--ink:#1F2421;--muted:#5D625E;--line:#E4E0D6;--accent:#2F5D50;--accent-ink:#FFFFFF;--soft:#EEF3F0;--warn:#8A4B12}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px;scroll-padding-bottom:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Work Sans',system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
a{color:var(--accent)}
button{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.top img{width:34px;height:34px}
.top .who{font-weight:600;font-size:15px;line-height:1.2}
.top .who span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.top .saved{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.steps{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.done{color:var(--accent);border-color:#BFD3CB}
main.wrap{padding:24px 20px calc(130px + env(safe-area-inset-bottom))}
.kicker{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.step-h{font-size:clamp(30px,6vw,42px);margin:8px 0 10px}
.lead{color:var(--muted);margin:0 0 28px;font-size:18px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 14px}
.q[hidden]{display:none}
.q>label,.q legend{display:block;font-weight:600;font-size:17px;margin:0 0 4px;padding:0}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.help{color:var(--muted);font-size:15px;margin:0 0 12px}
.q .opt-list{margin-top:10px}
input[type=text],input[type=email],input[type=url],input[type=tel],textarea,select{width:100%;font:inherit;color:inherit;background:#FCFBF8;border:1px solid #D6D1C4;border-radius:10px;padding:12px 14px;margin-top:8px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid #BFD3CB;border-color:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0 0;cursor:pointer;min-height:48px}
.opt:hover{border-color:#C9C3B4}
.opt input{margin:4px 0 0;width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt small{display:block;color:var(--muted);font-size:14px}
.other{margin-left:44px;width:calc(100% - 44px)!important}
.scale{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scale label{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:600}
.scale label.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin:0 0 18px;font-size:15px}
.note.warn{background:#FBF1E6;color:#5C3410}
.intro p{margin:0 0 14px}
.intro ul{margin:0 0 14px;padding-left:20px}
.dname{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dopen{font-size:14px;font-weight:600}
.dbtn{border:1px solid #CFC9BA;background:#fff;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;color:var(--ink)}
.rank{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.rcard{display:grid;grid-template-columns:44px 220px minmax(0,1fr);gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;transition:box-shadow .15s,border-color .15s}
.rcard.first{border-color:var(--accent);box-shadow:0 0 0 3px #BFD3CB}
.rcard.dragging{position:relative;z-index:3;border-color:var(--accent);box-shadow:0 14px 34px rgba(31,36,33,.2)}
.rside{display:flex;flex-direction:column;align-items:center;gap:4px}
.rnum{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.rcard.first .rnum{background:var(--accent)}
.grip{touch-action:none;cursor:grab;border:0;background:none;color:var(--muted);border-radius:8px;min-width:40px;min-height:40px;display:grid;place-items:center}
.grip:hover{background:var(--soft);color:var(--ink)}
.dragging .grip{cursor:grabbing}
.rmove{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;width:36px;height:32px;cursor:pointer;font-size:15px;line-height:1}
.rmove[disabled]{opacity:.35;cursor:default}
.thumb{position:relative;aspect-ratio:16/11;overflow:hidden;background:#EEE}
.thumb iframe{position:absolute;top:0;left:0;width:1280px;height:880px;border:0;transform-origin:0 0;pointer-events:none}
.rcard .thumb{display:block;border:1px solid var(--line);border-radius:8px}
.rinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.rinfo small{color:var(--muted);font-size:14px;line-height:1.4}
.rinfo textarea{min-height:76px;margin-top:4px}
@media (max-width:640px){.rcard{grid-template-columns:44px minmax(0,1fr);gap:12px}.rinfo{grid-column:1 / -1}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.nav .wrap{display:flex;gap:10px;align-items:center;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:600;cursor:pointer;min-height:48px;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);margin-left:auto}
.btn.pri:hover{background:#244A3F}
.btn.sec{background:transparent;color:var(--ink);border:1px solid #CFC9BA}
.btn:focus-visible,.chip:focus-visible,.dbtn:focus-visible,.grip:focus-visible,.rmove:focus-visible{outline:3px solid #8FB8A9;outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.count{font-size:13px;color:var(--muted)}
.review-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.review-sec h3{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.review-sec h3 button{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px}
.review-sec dl{margin:10px 0 0}
.review-sec dt{font-size:14px;color:var(--muted);margin-top:10px}
.review-sec dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:#A09A8C;font-style:italic}
.files{margin-top:10px;font-size:15px}
.files li{margin:4px 0}
.done-box{text-align:center;padding:40px 0}
.done-box h1{font-size:clamp(34px,7vw,52px);margin:0 0 14px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
@media (max-width:520px){.q{padding:16px}.btn{padding:12px 16px}.top .saved{display:none}}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<img src="images/logo.webp" alt="" width="34" height="34">
<div class="who">Your new website<span>Questions for Derryn, from Jandre</span></div>
<div class="saved" id="saved" aria-live="polite"></div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="wrap"><nav class="steps" id="chips" aria-label="Sections"></nav></div>
</header>

<main class="wrap" id="main"></main>

<div class="nav" id="nav">
<div class="wrap">
<button class="btn sec" id="back" type="button">Back</button>
<span class="count" id="count"></span>
<button class="btn pri" id="next" type="button">Next</button>
</div>
</div>

<script>
// Paste the Google Apps Script web app URL here (see setup/README.md).
var ENDPOINT = '';

var STORE = 'dh-website-brief-v2';
var MAX_FILE_MB = 10;

var DESIGNS = [
  {id:'1', file:'1-clinical-calm.html', name:'Clinical Calm', color:'#0B5F63', blurb:'White and teal. Clean and clinical, like a modern practice.'},
  {id:'2', file:'2-fynbos-editorial.html', name:'Fynbos Editorial', color:'#55663A', blurb:'Cream and olive. Calm and personal, with a Stellenbosch feel.'},
  {id:'3', file:'3-bold-movement.html', name:'Bold Movement', color:'#FF6B2C', blurb:'Dark and orange. Sporty, for active people and athletes.'},
  {id:'4', file:'4-warm-and-welcoming.html', name:'Warm and Welcoming', color:'#B4472A', blurb:'Bigger text and warm colours. Good for older patients.'},
  {id:'5', file:'5-two-front-doors.html', name:'Two Front Doors', color:'#1F4FA3', blurb:'Navy and blue. Separate paths for patients and referring doctors.'}
];
var DESIGN_NAMES = DESIGNS.map(function(d){return 'Design '+d.id+': '+d.name;});

// Question types: text, email, url, tel, textarea, radio, checks, scale, rank, files.
// "other: true" adds an "Other" option with a text box. "show" decides whether a question appears.
var STEPS = [
{id:'welcome', chip:'Start', title:'Hi Derryn', intro:
  '<p>Thanks for doing this. Your answers give me what I need to build your new website.</p>'+
  '<ul><li>It takes about 10 to 15 minutes. Most questions are just a tap.</li>'+
  '<li>Your answers save on this device as you go, so you can stop and carry on later.</li>'+
  '<li>Skip anything you\'re not sure about. We can chat about it.</li>'+
  '<li>Some answers are already filled in from your current page. Just check them.</li></ul>'+
  '<p class="note warn" style="margin-top:6px">Please don\'t include any patient names or health details in this form.</p>',
 qs:[
  {k:'name', t:'text', l:'Your name', def:'Derryn Holliday'},
  {k:'contact_pref', t:'radio', l:'Best way for me to reach you with questions?', o:['WhatsApp','Phone call','Email']}
 ]},

{id:'design', chip:'Designs', title:'Rank these quick designs', lead:'These are just quick designs to give you an idea of what you might like or not like. None of them is the final site. Open each one to have a look, drag them into order with your favourite at the top, and jot down what you like about each. Mixing is fine, like the colours of one with the layout of another.',
 qs:[
  {k:'design_rank', t:'rank', l:'Your ranking'},
  {k:'logo', t:'radio', l:'Your red "dh" logo: what should we do with it?', o:['Keep it as it is','Keep it, but tidy it up or match the colours','Make a new logo','Not sure, let\'s chat']}
 ]},

{id:'about', chip:'About you', title:'About you', lead:'For your About page. Check what\'s filled in and fix anything wrong.',
 qs:[
  {k:'years', t:'text', l:'Years of experience', def:'26'},
  {k:'quals', t:'textarea', l:'Qualifications', def:'BSc Sports Science and Honours in Biokinetics, Stellenbosch University'},
  {k:'hpcsa', t:'text', l:'HPCSA registration number', h:'Usually shown in the footer.'},
  {k:'bio', t:'textarea', l:'A few lines about you, in your own words', h:'How you got into biokinetics, how you work with patients. Rough notes are fine. I\'ll tidy it up.'}
 ]},

{id:'practice', chip:'Practice', title:'Your practice', lead:'Where and when patients can find you.',
 qs:[
  {k:'address', t:'textarea', l:'Address', def:'Valerida Centre, Suite 201\n21 Piet Retief St, Krigeville\nStellenbosch, 7600'},
  {k:'hours_week', t:'text', l:'Weekday hours', def:'Monday to Friday, 06:00 to 18:00'},
  {k:'hours_sat', t:'radio', l:'Saturdays', o:['By appointment','Closed','Open (give times below)']},
  {k:'hours_sat_times', t:'text', l:'Saturday times', show:function(a){return a.hours_sat==='Open (give times below)';}},
  {k:'phone', t:'tel', l:'Phone number for the site', def:'083 556 2149'},
  {k:'whatsapp_same', t:'radio', l:'Is WhatsApp on the same number?', o:['Yes','No, different number']},
  {k:'whatsapp_no', t:'tel', l:'WhatsApp number', show:function(a){return a.whatsapp_same==='No, different number';}},
  {k:'parking', t:'radio', l:'Parking', o:['Free parking at the building','Paid parking nearby','Street parking'], other:true},
  {k:'access', t:'radio', l:'Can someone on crutches or in a wheelchair get to your rooms easily?', o:['Yes, there\'s a lift or ramp','Only by stairs','Not sure']}
 ]},

{id:'money', chip:'Fees', title:'Sessions and fees', lead:'Show as much or as little as you like.',
 qs:[
  {k:'len_initial', t:'radio', l:'How long is a first consultation?', o:['45 minutes','60 minutes','90 minutes'], other:true},
  {k:'len_follow', t:'radio', l:'How long is a follow-up session?', o:['30 minutes','45 minutes','60 minutes'], other:true},
  {k:'prices_show', t:'radio', l:'Show prices on the site?', o:['Yes, show prices','Show "from" prices only','No, don\'t show prices']},
  {k:'prices', t:'textarea', l:'Your prices', h:'Per service.', show:function(a){return a.prices_show&&a.prices_show.indexOf('No')!==0;}},
  {k:'med_claim', t:'radio', l:'How does medical aid work at your practice?', o:['I claim from medical aid directly','Patients pay me and claim back themselves','It depends on the scheme'], other:true}
 ]},

{id:'services', chip:'Services', title:'Services and conditions', lead:'Tick what you offer. Conditions can each get their own page, which helps people find you on Google.',
 qs:[
  {k:'services', t:'checks', l:'Which services do you offer?', o:['Assessment and rehab sessions','Home visits','Online sessions (video)','Discovery Vitality assessments','Paired sessions','Small group classes','Return-to-sport testing','School or club screenings'], other:true},
  {k:'home_area', t:'text', l:'Which areas do you cover for home visits?', h:'For example: Stellenbosch only, or up to 10 km.', show:function(a){return (a.services||[]).indexOf('Home visits')>-1;}},
  {k:'conditions', t:'checks', l:'Which conditions should potentially get their own page on your site?', o:['Knee and ACL injuries','Back and neck pain','Joint replacements','Other surgery rehab','Sports injuries','Diabetes','Heart and blood pressure','Arthritis','Osteoporosis','Healthy ageing and falls','Neurological (stroke, Parkinson\'s, MS)','Pregnancy and postnatal'], other:true}
 ]},

{id:'online', chip:'Online', title:'Web address and Google', lead:'Your domain is your web address. A .co.za costs roughly R100 to R200 a year, registered in your name so you own it.',
 qs:[
  {k:'domain_pick', t:'checks', l:'Which web addresses do you like?', h:'Tick any. I\'ll check which are free.', o:['derrynholliday.co.za','derrynhollidaybio.co.za','hollidaybiokinetics.co.za'], other:true},
  {k:'email_domain', t:'radio', l:'Want an email address on it, like derryn@derrynholliday.co.za?', o:['Yes','No, my current email is fine','Not sure']},
  {k:'gbp_access', t:'radio', l:'Can you log in to your Google Maps business listing?', o:['Yes','No, someone else set it up','I don\'t know']},
  {k:'gbp_manager', t:'radio', l:'Can I be added as a manager to update it?', h:'I\'d change the category to "Biokineticist" and link it to the new site. You stay the owner.', o:['Yes','I\'d rather do it myself','Let\'s chat']},
  {k:'socials', t:'text', l:'Facebook, Instagram or LinkedIn links (optional)'}
 ]},

{id:'extras', chip:'Photos', title:'Photos and extras', lead:'Nearly done.',
 qs:[
  {k:'features', t:'checks', l:'Any ideas for interesting additional features you might like?', o:[
    {v:'Vitality assessment page', d:'What it involves and how to book.'},
    {v:'Exercise handouts for patients', d:'Patients can view or download their exercises.'},
    {v:'School and varsity athletes page', d:'For athletes, parents and coaches.'},
    {v:'Afrikaans version of the site'}
  ], other:true},
  {k:'photo_files', t:'files', l:'Upload photos or your logo (optional)', h:'Up to '+MAX_FILE_MB+' MB per file. Or WhatsApp them to me.'},
  {k:'launch', t:'text', l:'When would you like the site to go live?'},
  {k:'anything_else', t:'textarea', l:'Anything else?'}
 ]},

{id:'review', chip:'Send', title:'Check and send', review:true}
];

// ---------- state ----------
var A = {};          // answers
var FILES = [];      // File objects (not saved between visits)
var cur = 0;
var visited = {};

function load(){try{var s=JSON.parse(localStorage.getItem(STORE)||'null');if(s){A=s.a||{};cur=Math.min(s.cur||0,STEPS.length-1);visited=s.visited||{};}}catch(e){}}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify({a:A,cur:cur,visited:visited}));flash('Saved on this device');}
  catch(e){flash('');}
}
var flashT;
function flash(t){var el=document.getElementById('saved');el.textContent=t;clearTimeout(flashT);if(t)flashT=setTimeout(function(){el.textContent='';},2000);}

// Prefill defaults the first time.
function applyDefaults(){
  STEPS.forEach(function(s){(s.qs||[]).forEach(function(q){if(q.def!==undefined&&A[q.k]===undefined)A[q.k]=q.def;});});
}

// ---------- helpers ----------
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='text')el.textContent=attrs[k];
    else if(k==='html')el.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==false&&attrs[k]!=null)el.setAttribute(k,attrs[k]===true?'':attrs[k]);
  }
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;if(Array.isArray(c))c.forEach(function(x){if(x)el.appendChild(x);});else el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;
}
function optVal(o){return typeof o==='string'?o:o.v;}
function visible(q){return !q.show||q.show(A);}
function answered(v){return Array.isArray(v)?v.length>0:(v!==undefined&&v!==null&&String(v).trim()!=='');}
function set(k,v){A[k]=v;save();refreshVisibility();updateCount();}

// ---------- rendering ----------
function renderChips(){
  var c=document.getElementById('chips');c.innerHTML='';
  STEPS.forEach(function(s,i){
    var b=h('button',{type:'button','class':'chip'+(i===cur?' on':'')+(visited[s.id]&&i!==cur?' done':''),text:s.chip,onclick:function(){go(i);}});
    if(i===cur)b.setAttribute('aria-current','step');
    c.appendChild(b);
  });
  var on=c.querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
  document.getElementById('bar').style.width=(cur/(STEPS.length-1)*100)+'%';
}

function renderQ(q){
  var id='q_'+q.k;
  var wrap=h('div',{'class':'q','data-k':q.k});
  var help=q.h?h('p',{'class':'help',text:q.h}):null;
  var t=q.t;
  if(['text','email','url','tel'].indexOf(t)>-1){
    var inp=h('input',{type:t,id:id,value:A[q.k]||'',autocomplete:t==='email'?'email':'off',oninput:function(e){set(q.k,e.target.value);}});
    wrap.appendChild(h('label',{'for':id,text:q.l}));if(help)wrap.appendChild(help);wrap.appendChild(inp);
  }else if(t==='textarea'){
    var ta=h('textarea',{id:id,oninput:function(e){set(q.k,e.target.value);}});ta.value=A[q.k]||'';
    wrap.appendChild(h('label',{'for':id,text:q.l}));if(help)wrap.appendChild(help);wrap.appendChild(ta);
  }else if(t==='radio'||t==='checks'){
    var fs=h('fieldset',null,h('legend',{text:q.l}));if(help)fs.appendChild(help);
    var list=h('div',{'class':'opt-list'});
    var opts=q.o.slice();if(q.other)opts.push({v:'Other',d:null,other:true});
    var otherBox=null;
    opts.forEach(function(o,i){
      var v=optVal(o),d=typeof o==='object'?o.d:null;
      var checked=t==='radio'?A[q.k]===v:(A[q.k]||[]).indexOf(v)>-1;
      var inp=h('input',{type:t==='radio'?'radio':'checkbox',name:id,value:v,checked:checked,onchange:function(){
        if(t==='radio'){set(q.k,v);}
        else{var arr=(A[q.k]||[]).filter(function(x){return x!==v;});if(inp.checked)arr.push(v);set(q.k,arr);}
        list.querySelectorAll('.opt').forEach(function(l){l.classList.toggle('sel',l.querySelector('input').checked);});
        if(otherBox)otherBox.hidden=!(t==='radio'?A[q.k]==='Other':(A[q.k]||[]).indexOf('Other')>-1);
      }});
      list.appendChild(h('label',{'class':'opt'+(checked?' sel':'')},inp,h('span',null,v,d?h('small',{text:d}):null)));
    });
    if(q.other){
      otherBox=h('input',{type:'text','class':'other','aria-label':q.l+': other',placeholder:'Type it here',value:A[q.k+'_other']||'',oninput:function(e){set(q.k+'_other',e.target.value);}});
      otherBox.hidden=!(t==='radio'?A[q.k]==='Other':(A[q.k]||[]).indexOf('Other')>-1);
      list.appendChild(otherBox);
    }
    fs.appendChild(list);wrap.appendChild(fs);
  }else if(t==='scale'){
    var fs2=h('fieldset',null,h('legend',{text:q.l}));if(help)fs2.appendChild(help);
    var sc=h('div',{'class':'scale'});
    for(var n=q.min;n<=q.max;n++)(function(n){
      var inp=h('input',{type:'radio',name:id,value:n,checked:String(A[q.k])===String(n),onchange:function(){set(q.k,String(n));sc.querySelectorAll('label').forEach(function(l){l.classList.toggle('sel',l.querySelector('input').checked);});}});
      sc.appendChild(h('label',{'class':String(A[q.k])===String(n)?'sel':''},inp,String(n)));
    })(n);
    fs2.appendChild(sc);fs2.appendChild(h('div',{'class':'scale-ends'},h('span',{text:q.lo}),h('span',{text:q.hi})));
    wrap.appendChild(fs2);
  }else if(t==='rank'){
    var order=(A.design_rank||[]).filter(function(n){return DESIGN_NAMES.indexOf(n)>-1;});
    DESIGN_NAMES.forEach(function(n){if(order.indexOf(n)<0)order.push(n);});
    wrap.appendChild(h('div',{style:'font-weight:600'},q.l));
    wrap.appendChild(h('p',{'class':'help'},'Drag the dotted handle, or use the arrows. Number 1 is your favourite.'));
    var rl=h('div',{'class':'rank'}),cards={};
    var paintRank=function(){order.forEach(function(n,i){var c=cards[n];c.style.order=i;c._num.textContent=i+1;c.classList.toggle('first',i===0);c._up.disabled=i===0;c._down.disabled=i===order.length-1;});};
    var commitRank=function(){A.design_rank=order.slice();save();updateCount();};
    var moveRank=function(n,dir){var i=order.indexOf(n),j=i+dir;if(j<0||j>=order.length)return;order.splice(i,1);order.splice(j,0,n);paintRank();commitRank();cards[n].scrollIntoView({block:'nearest'});};
    DESIGNS.forEach(function(d,i){
      var name=DESIGN_NAMES[i],lk='design_like_'+d.id;
      var ta=h('textarea',{'aria-label':'What you like about '+d.name,placeholder:'What do you like about this one?',oninput:function(e){set(lk,e.target.value);}});ta.value=A[lk]||'';
      var num=h('span',{'class':'rnum'});
      var grip=h('button',{type:'button','class':'grip','aria-label':'Drag to move '+d.name,html:'<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="7" cy="4" r="1.7"/><circle cx="13" cy="4" r="1.7"/><circle cx="7" cy="10" r="1.7"/><circle cx="13" cy="10" r="1.7"/><circle cx="7" cy="16" r="1.7"/><circle cx="13" cy="16" r="1.7"/></svg>'});
      var up=h('button',{type:'button','class':'rmove','aria-label':'Move '+d.name+' up',text:'\u2191',onclick:function(){moveRank(name,-1);}});
      var down=h('button',{type:'button','class':'rmove','aria-label':'Move '+d.name+' down',text:'\u2193',onclick:function(){moveRank(name,1);}});
      var card=h('div',{'class':'rcard'},
        h('div',{'class':'rside'},num,grip,up,down),
        h('a',{'class':'thumb',href:d.file,target:'_blank',rel:'noopener','aria-label':'Open '+d.name+' full size'},h('iframe',{src:d.file,title:'Preview of '+d.name,loading:'lazy',tabindex:'-1','aria-hidden':'true'})),
        h('div',{'class':'rinfo'},
          h('div',{'class':'dname'},h('span',{'class':'dot',style:'background:'+d.color}),name),
          h('small',{text:d.blurb}),
          h('a',{'class':'dopen',href:d.file,target:'_blank',rel:'noopener',text:'Open full size'}),
          ta));
      card._num=num;card._up=up;card._down=down;cards[name]=card;
      // Drag by the handle. Cards are reordered with CSS order so the previews don't reload.
      grip.addEventListener('pointerdown',function(e){
        if(e.button!==0)return;e.preventDefault();grip.setPointerCapture(e.pointerId);
        card.classList.add('dragging');var moved=false;
        var onMove=function(ev){
          var y=ev.clientY;
          if(y<150)window.scrollBy(0,-14);else if(y>innerHeight-110)window.scrollBy(0,14);
          var others=order.filter(function(n){return n!==name;}),at=others.length;
          for(var k=0;k<others.length;k++){var r=cards[others[k]].getBoundingClientRect();if(y<r.top+r.height/2){at=k;break;}}
          others.splice(at,0,name);
          if(others.join('|')!==order.join('|')){order=others;paintRank();moved=true;}
        };
        var onUp=function(){grip.removeEventListener('pointermove',onMove);grip.removeEventListener('pointerup',onUp);grip.removeEventListener('pointercancel',onUp);card.classList.remove('dragging');if(moved)commitRank();};
        grip.addEventListener('pointermove',onMove);grip.addEventListener('pointerup',onUp);grip.addEventListener('pointercancel',onUp);
      });
      rl.appendChild(card);
    });
    paintRank();wrap.appendChild(rl);
    wrap.appendChild(h('p',{'class':'help',style:'margin:12px 0 0'},'Prefer the big overview? ',h('a',{href:'designs.html',target:'_blank',rel:'noopener',text:'See all five designs on one page'}),'.'));
  }else if(t==='files'){
    wrap.appendChild(h('label',{'for':id,text:q.l}));if(help)wrap.appendChild(help);
    var list2=h('ul',{'class':'files'});
    var fi=h('input',{type:'file',id:id,multiple:true,accept:'image/*,.pdf,.doc,.docx,.ai,.eps,.svg',onchange:function(){
      Array.prototype.forEach.call(fi.files,function(f){
        if(f.size>MAX_FILE_MB*1024*1024){alertMsg(f.name+' is bigger than '+MAX_FILE_MB+' MB. Please WhatsApp it instead.');return;}
        FILES.push(f);
      });
      fi.value='';drawFiles();updateCount();
    }});
    function drawFiles(){list2.innerHTML='';FILES.forEach(function(f,i){list2.appendChild(h('li',null,f.name+' ('+(f.size/1048576).toFixed(1)+' MB) ',h('button',{type:'button','class':'dbtn',style:'flex:none;min-height:32px;padding:4px 10px',text:'Remove',onclick:function(){FILES.splice(i,1);drawFiles();}})));});}
    wrap.appendChild(h('input',{type:'hidden'}));wrap.appendChild(fi);wrap.appendChild(list2);drawFiles();
  }
  return wrap;
}

function alertMsg(t){var m=document.getElementById('main');var n=h('p',{'class':'note warn',role:'alert',text:t});m.insertBefore(n,m.firstChild);setTimeout(function(){n.remove();},6000);}

function refreshVisibility(){
  var s=STEPS[cur];if(!s.qs)return;
  s.qs.forEach(function(q){var el=document.querySelector('.q[data-k="'+q.k+'"]');if(el)el.hidden=!visible(q);});
}

function stepCounts(s){
  var total=0,done=0;
  (s.qs||[]).forEach(function(q){if(!visible(q))return;total++;
    if(q.t==='rank'){if(A.design_rank||DESIGNS.some(function(d){return answered(A['design_like_'+d.id]);}))done++;}
    else if(q.t==='files'){if(FILES.length)done++;}
    else if(answered(A[q.k]))done++;});
  return {total:total,done:done};
}
function updateCount(){
  var s=STEPS[cur],el=document.getElementById('count');
  if(!s.qs){el.textContent='';return;}
  var c=stepCounts(s);el.textContent=c.done+' of '+c.total+' answered';
}

function render(){
  var s=STEPS[cur],m=document.getElementById('main');m.innerHTML='';
  visited[s.id]=true;
  var head=h('div',null,h('div',{'class':'kicker',text:'Step '+(cur+1)+' of '+STEPS.length}),h('h1',{'class':'step-h',text:s.title}));
  m.appendChild(head);
  if(s.intro)m.appendChild(h('div',{'class':'intro lead',html:s.intro}));
  if(s.lead)m.appendChild(h('p',{'class':'lead',text:s.lead}));
  if(s.image)m.appendChild(h('img',{src:s.image,alt:'Current logo',width:96,height:96,style:'display:block;margin:-8px 0 22px'}));
  if(s.review)renderReview(m);
  else s.qs.forEach(function(q){var el=renderQ(q);el.hidden=!visible(q);m.appendChild(el);});
  renderChips();updateCount();
  document.getElementById('back').hidden=cur===0;
  var nx=document.getElementById('next');
  nx.textContent=s.review?'Send to Jandre':(cur===0?'Let\'s start':'Next');
  nx.onclick=s.review?submit:function(){go(cur+1);};
  fitThumbs();
}

function go(i){if(i<0||i>=STEPS.length)return;cur=i;save();render();window.scrollTo(0,0);var hd=document.querySelector('.step-h');if(hd){hd.setAttribute('tabindex','-1');hd.focus({preventScroll:true});}}

// ---------- review ----------
function fmt(q){
  var v=A[q.k];
  if(q.t==='rank'){
    var out=[],ranked=!!A.design_rank;
    (A.design_rank||DESIGN_NAMES).forEach(function(n,i){var lk=A['design_like_'+n.split(':')[0].replace('Design ','')];
      if(ranked)out.push((i+1)+'. '+n+(lk?'\n   Likes: '+lk:''));else if(lk)out.push(n+'\n   Likes: '+lk);});
    return (ranked?'':(out.length?'Not ranked yet\n':''))+out.join('\n');
  }
  if(q.t==='files')return FILES.map(function(f){return f.name;}).join(', ');
  if(Array.isArray(v)){var arr=v.map(function(x){return x==='Other'&&A[q.k+'_other']?'Other: '+A[q.k+'_other']:x;});return arr.join(', ');}
  if(v==='Other'&&A[q.k+'_other'])return 'Other: '+A[q.k+'_other'];
  return v==null?'':String(v);
}
function collect(){
  var items=[];
  STEPS.forEach(function(s){(s.qs||[]).forEach(function(q){if(!visible(q))return;items.push({section:s.title,key:q.k,question:q.l,answer:fmt(q)});});});
  return items;
}
function renderReview(m){
  var items=collect(),blank=items.filter(function(i){return !i.answer.trim();}).length;
  m.appendChild(h('p',{'class':'lead',text:blank?'You skipped '+blank+' questions. That\'s fine, send it anyway and we\'ll fill the gaps together. Or tap "Edit" to go back.':'You answered everything. Thank you!'}));
  STEPS.forEach(function(s,i){
    if(!s.qs)return;
    var dl=h('dl');
    s.qs.forEach(function(q){if(!visible(q))return;var a=fmt(q);dl.appendChild(h('dt',{text:q.l}));dl.appendChild(h('dd',{'class':a.trim()?'':'empty',text:a.trim()?a:'Skipped'}));});
    m.appendChild(h('section',{'class':'review-sec'},h('h3',null,s.title,h('button',{type:'button',text:'Edit',onclick:function(){go(i);}})),dl));
  });
  if(!ENDPOINT)m.appendChild(h('p',{'class':'note warn',text:'Sending isn\'t switched on yet. Tap the button below to download your answers as a file, then WhatsApp or email it to Jandre.'}));
}

// ---------- submit ----------
function payload(){
  return {submissionId:new Date().toISOString().replace(/[:.]/g,'-')+'-'+Math.random().toString(36).slice(2,7),
    submittedAt:new Date().toISOString(),userAgent:navigator.userAgent,answers:A,items:collect(),
    files:FILES.map(function(f){return f.name;})};
}
function download(p){
  var lines=['Website questions for Derryn Holliday','Sent: '+new Date().toLocaleString('en-ZA'),''];var sec='';
  p.items.forEach(function(i){if(i.section!==sec){sec=i.section;lines.push('','== '+sec+' ==');}lines.push(i.question,'  '+(i.answer||'(skipped)'));});
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});var a=h('a',{href:URL.createObjectURL(blob),download:'derryn-website-answers.txt'});
  document.body.appendChild(a);a.click();a.remove();
}
function readB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=rej;r.readAsDataURL(f);});}
function post(obj){return fetch(ENDPOINT,{method:'POST',body:JSON.stringify(obj)}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');return j;});}

function submit(){
  var p=payload(),btn=document.getElementById('next');
  if(!ENDPOINT){download(p);done(false);return;}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Sending';
  post({action:'submit',data:p}).then(function(){
    var chain=Promise.resolve(),n=0;
    FILES.forEach(function(f){chain=chain.then(function(){n++;btn.innerHTML='<span class="spinner"></span>Uploading '+n+' of '+FILES.length;return readB64(f);})
      .then(function(b64){return post({action:'upload',submissionId:p.submissionId,name:f.name,type:f.type||'application/octet-stream',data:b64});});});
    return chain;
  }).then(function(){done(true);}).catch(function(e){
    btn.disabled=false;btn.textContent='Try again';
    var m=document.getElementById('main');
    m.appendChild(h('p',{'class':'note warn',role:'alert'},'Something went wrong sending your answers ('+e.message+'). They\'re still saved on this device. ',h('a',{href:'#',text:'Download them as a file',onclick:function(ev){ev.preventDefault();download(p);}}),' and WhatsApp it to Jandre.'));
  });
}
function done(sent){
  try{var s=JSON.parse(localStorage.getItem(STORE)||'{}');s.sent=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(s));}catch(e){}
  document.getElementById('nav').hidden=true;
  var m=document.getElementById('main');m.innerHTML='';
  m.appendChild(h('div',{'class':'done-box'},h('h1',{text:'Thank you, Derryn!'}),
    h('p',{'class':'lead',text:sent?'Your answers are with me. I\'ll go through them and WhatsApp you if anything is unclear.':'Your answers downloaded as a file. Please WhatsApp or email it to me.'}),
    h('p',null,h('a',{href:'#',text:'Go back and change something',onclick:function(e){e.preventDefault();document.getElementById('nav').hidden=false;render();}}))));
}

// ---------- thumbnails ----------
function fitThumbs(){document.querySelectorAll('.thumb').forEach(function(t){var f=t.querySelector('iframe');if(f)f.style.transform='scale('+(t.clientWidth/1280)+')';});}
window.addEventListener('resize',fitThumbs);

document.getElementById('back').onclick=function(){go(cur-1);};
load();applyDefaults();render();
</script>
</body>
</html>
